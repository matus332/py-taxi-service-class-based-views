{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>

  <p><b>License number:</b> {{ driver.license_number }}</p>

  <h2>Cars</h2>

  {% if driver.cars.all %}
    <ul>
      {% for car in driver.cars.all %}
        <li>
          {{ car.model }} — {{ car.manufacturer.name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cars</p>
  {% endif %}
{% endblock %}
